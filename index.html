<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10152f"><meta name="description" content="JAY App — jump, dodge, and chase your high score in this free endless runner."><title>JAY App — Endless Runner</title>
<style>
:root{color-scheme:dark;--ink:#f8fbff;--muted:#aab6d8;--lime:#d7ff62;--violet:#9a7bff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29346a 0,#151a3a 45%,#0b1024 100%);color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}.wrap{width:min(100%,900px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 16px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--lime),#7df0c7);color:#13182c;font-weight:1000;font-size:21px;box-shadow:0 8px 30px #baff5c30}.eyebrow{font-size:11px;letter-spacing:2.5px;color:var(--lime);font-weight:800}.brand h1{font-size:clamp(22px,4vw,32px);margin:1px 0 0;letter-spacing:-1px}.pill{border:1px solid #ffffff22;border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px;background:#ffffff08;white-space:nowrap}.panel{border:1px solid #ffffff20;background:#ffffff09;border-radius:26px;padding:12px;box-shadow:0 24px 80px #0005;backdrop-filter:blur(10px)}.hud{display:flex;justify-content:space-between;gap:10px;padding:8px 8px 13px}.stat{flex:1;padding:10px 14px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff0e}.stat span{display:block;color:var(--muted);font-size:10px;letter-spacing:1.8px;font-weight:800}.stat strong{display:block;font-size:clamp(21px,4vw,29px);margin-top:3px;letter-spacing:-1px}.stat strong em{font-style:normal;color:var(--lime)}.gamebox{position:relative;overflow:hidden;border-radius:19px;background:#141b3e;line-height:0;touch-action:manipulation}canvas{width:100%;height:auto;aspect-ratio:800/390;display:block;touch-action:manipulation}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;background:linear-gradient(180deg,#10152f30,#10152fba);line-height:1.4}.overlay.hidden{display:none}.orb{font-size:clamp(35px,8vw,64px);filter:drop-shadow(0 8px 20px #d7ff6250);margin-bottom:5px}.overlay h2{font-size:clamp(25px,5vw,42px);letter-spacing:-1.6px;margin:0 0 5px}.overlay p{margin:0 0 18px;color:#d4dcf5;font-size:clamp(12px,2.2vw,15px)}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}.primary{background:var(--lime);color:#14192e;font-weight:1000;border-radius:14px;padding:13px 25px;box-shadow:0 7px 0 #91b82d;transition:transform .12s,box-shadow .12s}.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #91b82d}.below{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 6px 3px;color:var(--muted);font-size:12px}.below b{color:var(--ink)}.controls{display:flex;gap:8px;align-items:center}.mini{border:1px solid #ffffff20;background:#ffffff0b;color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:800}.mini:active{background:#ffffff20}.hint{text-align:center;color:#8997c1;font-size:11px;margin:15px 0 0;letter-spacing:.3px}.hint span{color:var(--lime)}@media(max-width:520px){body{padding:12px 9px;align-items:flex-start}.wrap{margin-top:8px}.panel{padding:7px;border-radius:21px}.hud{padding:7px 5px 10px;gap:6px}.stat{padding:8px 9px;border-radius:12px}.pill{font-size:10px;padding:7px 9px}.logo{width:42px;height:42px;border-radius:14px}.below{align-items:flex-start;flex-direction:column}.controls{width:100%}.mini{flex:1}.overlay p{margin-bottom:12px}}
</style></head>
<body><main class="wrap"><header><div class="brand"><div class="logo">J</div><div><div class="eyebrow">ARCADE • ORIGINAL</div><h1>JAY <span style="color:var(--lime)">RUNNER</span></h1></div></div><div class="pill">✦ FREE TO PLAY</div></header>
<section class="panel"><div class="hud"><div class="stat"><span>SCORE</span><strong id="score">0000</strong></div><div class="stat"><span>BEST RUN</span><strong><em id="best">0000</em></strong></div><div class="stat"><span>SPEED</span><strong id="speed">1.0<em>x</em></strong></div></div>
<div class="gamebox"><canvas id="game" width="800" height="390" aria-label="JAY Runner game. Tap or press space to jump over obstacles."></canvas><div class="overlay" id="overlay"><div class="orb">🏃‍♂️</div><h2 id="headline">READY, RUNNER?</h2><p id="subline">Jump over the blocks. Chase your best score.</p><button class="primary" id="start">LET'S RUN&nbsp; →</button></div></div>
<div class="below"><div>⚡ <b>Quick reflexes win.</b> Don't hit the blocks!</div><div class="controls"><button class="mini" id="jump" aria-label="Jump">↑ JUMP</button><button class="mini" id="restart">↻ RESTART</button></div></div></section><p class="hint">TAP THE GAME OR PRESS <span>SPACE</span> TO JUMP &nbsp;•&nbsp; MADE WITH ♥ BY JAY</p></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),restartBtn=document.getElementById('restart'),jumpBtn=document.getElementById('jump'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),speedEl=document.getElementById('speed'),headline=document.getElementById('headline'),subline=document.getElementById('subline');const W=800,H=390,ground=318;let state='ready',player,obstacles,particles,clouds,score,best=0,speed,spawn,frame,last=0,groundOffset=0;try{best=Number(localStorage.getItem('jay-runner-best'))||0}catch(e){}bestEl.textContent=pad(best);
function pad(n){return String(Math.floor(n)).padStart(4,'0')}function reset(){player={x:112,y:ground-54,w:39,h:54,vy:0,onGround:true,run:0};obstacles=[];particles=[];clouds=Array.from({length:6},(_,i)=>({x:i*155+20,y:40+Math.random()*115,s:.45+Math.random()*.8}));score=0;speed=5;spawn=45;frame=0;groundOffset=0;scoreEl.textContent=pad(0);speedEl.innerHTML='1.0<em>x</em>';}
function start(){reset();state='playing';overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function jump(){if(state==='ready'||state==='over'){start();return}if(player&&player.onGround){player.vy=-14.7;player.onGround=false;for(let i=0;i<6;i++)particles.push({x:player.x+10,y:ground-4,vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,life:20})}}
function end(){state='over';if(score>best){best=score;try{localStorage.setItem('jay-runner-best',String(best))}catch(e){}bestEl.textContent=pad(best)}headline.textContent='RUN OVER!';subline.textContent='You scored '+score+' points. Think you can beat it?';startBtn.textContent='RUN IT BACK  ↻';overlay.classList.remove('hidden')}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function drawBg(dt){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#222d62');g.addColorStop(.65,'#3c4b83');g.addColorStop(1,'#20294f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d7ff6230';ctx.beginPath();ctx.arc(654,79,38,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f2ffbd';ctx.beginPath();ctx.arc(654,79,24,0,Math.PI*2);ctx.fill();for(const c of clouds){if(state==='playing')c.x-=dt*.012*c.s;if(c.x< -100)c.x=W+30;ctx.fillStyle='#dbe7ff22';ctx.beginPath();ctx.ellipse(c.x,c.y,31*c.s,10*c.s,0,0,Math.PI*2);ctx.ellipse(c.x+20*c.s,c.y-5*c.s,22*c.s,13*c.s,0,0,Math.PI*2);ctx.ellipse(c.x+39*c.s,c.y,26*c.s,9*c.s,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#1c2850';ctx.beginPath();ctx.moveTo(0,250);ctx.lineTo(90,174);ctx.lineTo(170,248);ctx.lineTo(270,160);ctx.lineTo(400,251);ctx.lineTo(520,185);ctx.lineTo(640,250);ctx.lineTo(730,169);ctx.lineTo(800,224);ctx.lineTo(800,ground);ctx.lineTo(0,ground);ctx.fill();ctx.fillStyle='#26375d';ctx.beginPath();ctx.moveTo(0,286);ctx.lineTo(130,226);ctx.lineTo(250,282);ctx.lineTo(400,218);ctx.lineTo(550,282);ctx.lineTo(700,231);ctx.lineTo(800,275);ctx.lineTo(800,ground);ctx.lineTo(0,ground);ctx.fill();ctx.fillStyle='#192346';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#d7ff62';ctx.fillRect(0,ground,W,4);ctx.fillStyle='#ffffff24';for(let x=-groundOffset%60;x<W;x+=60)ctx.fillRect(x,ground+27,30,3)}
function drawPlayer(){const p=player;ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);const tilt=p.onGround?Math.sin(p.run*.23)*.035:-.12;ctx.rotate(tilt);ctx.shadowColor='#d7ff6270';ctx.shadowBlur=18;ctx.fillStyle='#d7ff62';rounded(-17,-22,34,38,12);ctx.shadowBlur=0;ctx.fillStyle='#192346';rounded(-9,-13,7,8,3);rounded(5,-13,7,8,3);ctx.fillStyle='#f7f9ff';rounded(1,-12,4,5,2);ctx.fillStyle='#9a7bff';rounded(-17,8,34,9,4);ctx.fillStyle='#d7ff62';let swing=p.onGround?Math.sin(p.run*.28)*7:0;ctx.save();ctx.translate(-7,16);ctx.rotate(swing*.04);rounded(-5,0,10,17,4);ctx.restore();ctx.save();ctx.translate(7,16);ctx.rotate(-swing*.04);rounded(-5,0,10,17,4);ctx.restore();ctx.restore()}
function drawObstacle(o){ctx.save();ctx.shadowColor='#ff668b55';ctx.shadowBlur=12;const g=ctx.createLinearGradient(o.x,0,o.x+o.w,0);g.addColorStop(0,'#ff638b');g.addColorStop(1,'#ff9b78');ctx.fillStyle=g;rounded(o.x,o.y,o.w,o.h,7);ctx.shadowBlur=0;ctx.fillStyle='#fff7';ctx.fillRect(o.x+7,o.y+8,4,Math.max(8,o.h-16));ctx.fillStyle='#e84f7c';ctx.fillRect(o.x+5,o.y+o.h-5,o.w-10,5);ctx.restore()}
function loop(now){if(state!=='playing')return;const dt=Math.min(now-last,32);last=now;frame++;score+=dt*.012*speed;speed=Math.min(10.5,5+score/360);groundOffset=(groundOffset+speed*dt*.06)%60;drawBg(dt);player.run+=dt*.04;if(!player.onGround){player.vy+=.72*dt/16;player.y+=player.vy*dt/16;if(player.y>=ground-player.h){player.y=ground-player.h;player.vy=0;player.onGround=true}}spawn-=dt/16;if(spawn<=0){const h=30+Math.random()*27,w=24+Math.random()*16;obstacles.push({x:W+10,y:ground-h,w,h});spawn=62+Math.random()*45-(speed-5)*4;spawn=Math.max(34,spawn)}for(const o of obstacles)o.x-=speed*dt*.06;obstacles=obstacles.filter(o=>o.x+o.w>-10);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--}particles=particles.filter(p=>p.life>0);ctx.save();for(const p of particles){ctx.globalAlpha=p.life/20;ctx.fillStyle='#d7ff62';ctx.fillRect(p.x,p.y,4,4)}ctx.restore();for(const o of obstacles){drawObstacle(o);const px=player.x+7,py=player.y+5,pw=player.w-13,ph=player.h-7;if(px<o.x+o.w-3&&px+pw>o.x+3&&py<o.y+o.h-2&&py+ph>o.y+3){end();drawBg(0);for(const ob of obstacles)drawObstacle(ob);drawPlayer();return}}drawPlayer();scoreEl.textContent=pad(score);speedEl.innerHTML=(speed/5).toFixed(1)+'<em>x</em>';requestAnimationFrame(loop)}
function renderIdle(){reset();drawBg(0);drawPlayer();for(let i=0;i<2;i++)drawObstacle({x:480+i*160,y:ground-40-(i%2)*13,w:29,h:40+(i%2)*13})}startBtn.addEventListener('click',start);restartBtn.addEventListener('click',()=>{start()});jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();jump()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}if(e.code==='Enter'&&state!=='playing')start()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state==='playing'){last=performance.now()}});renderIdle();})();
</script></body></html>
